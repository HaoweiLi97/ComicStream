<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191d23" media="(prefers-color-scheme: dark)">
  <title>ComicStream</title>
  <link rel="stylesheet" href="/reader.css">
  <script src="/dist/reader.js" type="module"></script>
</head>
<body>
  <header class="masthead">
    <span class="brand">ComicStream</span>
    <span id="book-title" class="book-title" hidden></span>
    <button id="cover-toggle" type="button" data-en="Cover" hidden>封面</button>
    <button id="change" type="button" data-en="Open another" hidden>打开其他</button>
    <select id="reader-language" aria-label="界面语言" data-en-label="Language">
      <option value="zh" data-en="Simplified Chinese">简体中文</option>
      <option value="en">English</option>
    </select>
  </header>
  <main id="opening">
    <div class="opening-inner">
      <h1 data-en="Open comic">打开漫画</h1>
      <div class="sources">
        <div class="local" id="drop-area">
          <button class="primary" id="pick" type="button" aria-describedby="drop-hint" data-en="Choose .cstr file">选择 .cstr 文件</button>
          <span class="drop-hint" id="drop-hint" data-en="or drop the file here">或将文件拖到这里</span>
          <input id="file" type="file" accept=".cstr,application/octet-stream" hidden>
        </div>
        <form id="remote">
          <label for="address" data-en="Comic URL">漫画包链接</label>
          <div class="url-row">
            <input id="address" type="text" inputmode="url" placeholder="https://…/comic.cstr" required>
            <button type="submit" data-en="Open URL">打开链接</button>
          </div>
          <label class="check"><input id="mutable" type="checkbox"> <span data-en="Content at this URL can change">链接内容可能更新</span></label>
        </form>
      </div>
      <p id="open-status" role="status"></p>
    </div>
  </main>
  <main id="viewport" aria-label="漫画阅读区" data-en-label="Comic viewer" tabindex="0" hidden>
    <div id="pages"></div>
  </main>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="previews" aria-label="页面预览" data-en-label="Page thumbnails" hidden>
    <div id="preview-list"></div>
    <div class="preview-controls">
      <button id="preview-previous" type="button" data-en="Previous group">前一组</button>
      <span id="preview-range" role="status"></span>
      <button id="preview-next" type="button" data-en="Next group">后一组</button>
    </div>
  </section>
  <footer id="navigation" hidden>
    <div id="page-controls">
      <button id="previous" type="button"><span class="arrow" aria-hidden="true"></span><span data-en="Previous">上一页</span></button>
      <div class="page-count" dir="ltr">
        <label class="page-number"><span data-en="Page">第</span> <input type="number" min="1" id="page" aria-label="跳到第几页" data-en-label="Go to page"> <span data-en="">页</span></label>
        <span id="total"></span>
      </div>
      <button id="next" type="button"><span data-en="Next">下一页</span><span class="arrow" aria-hidden="true"></span></button>
    </div>
    <button id="preview-toggle" type="button" aria-controls="previews" aria-expanded="false" data-en="Thumbnails" hidden>页面预览</button>
  </footer>
  <dialog id="cover-dialog" aria-label="封面" data-en-label="Cover">
    <form method="dialog"><button type="submit" data-en="Close">关闭</button></form>
    <p id="cover-status" role="status"></p>
  </dialog>
</body>
</html>
